name: Compass CI
on:
  pull_request:
    # labeled/unlabeled: adding the human-approved label re-runs the guardrails check (REQ-036)
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main, master]
  # Nightly UI test run (03:00 Vietnam time) so regressions are logged as issues even without new commits
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Spec traceability check
        run: node compass/check-spec.mjs
      # REQ-036: protected/forbidden paths, max files per change, secrets, dependency changes (compass/guardrails.json)
      - name: Guardrails check
        if: github.event_name == 'pull_request'
        run: node compass/check-guardrails.mjs
      - name: Install
        run: if [ -f package-lock.json ]; then npm ci; elif [ -f package.json ]; then npm install; fi
      # REQ-034: library security check. Critical issues in the libraries shipped to users block the build;
      # the full report (incl. high / dev-only) is shown in the run summary.
      - name: Library security audit
        run: |
          { echo '## npm audit'; echo '```'; npm audit || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          npm audit --omit=dev --audit-level=critical
      - name: Test
        run: if [ -f package.json ]; then npm test --if-present; fi
      - name: Build
        run: if [ -f package.json ]; then npm run build --if-present; fi

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Install
        run: npm ci
      - name: Install the test browser
        run: npx playwright install --with-deps chromium
      - name: UI tests (demo mode)
        run: npm run test:e2e
      # On main and the nightly run, failing tests become GitHub issues (label: bug, e2e);
      # tests that pass again close their issue. Pull requests only show the failure in CI.
      - name: Log failing UI tests as GitHub issues
        if: always() && github.event_name != 'pull_request'
        run: node e2e/report-bugs.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Keep the test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14
