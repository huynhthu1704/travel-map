name: Compass Deploy
# The run title carries the deployed commit so a rollback can find the last good one
run-name: Deploy ${{ inputs.ref || github.event.workflow_run.head_sha || github.sha }}
# REQ-034: deploy only a commit whose Compass CI run is green, check the live site afterwards,
# and roll back to the last good version when that check fails.
# REQ-058: an automatic deploy publishes only the newest commit of main — CI runs can finish out of order, and the
# deploy of an older commit must not replace a newer site (its own deploy publishes the newest commit).
on:
  # Runs after Compass CI finishes on main (push only, not the nightly run)
  workflow_run:
    workflows: [Compass CI]
    types: [completed]
    branches: [main]
  # Manual deploy / rollback: Actions → Compass Deploy → Run workflow → enter a commit SHA (empty = latest main)
  workflow_dispatch:
    inputs:
      ref:
        description: 'Commit SHA or tag to deploy (empty = latest main)'
        required: false
        default: ''
permissions:
  contents: read
  pages: write
  id-token: write
  issues: write
  actions: write
concurrency:
  group: pages
  cancel-in-progress: false
env:
  SITE_URL: https://beetheremap.com
jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.ref.outputs.sha }}
      skip: ${{ steps.ref.outputs.skip }}
      entry: ${{ steps.entry.outputs.entry }}
    steps:
      - id: ref
        name: Pick the commit to deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            sha="${{ github.event.workflow_run.head_sha }}"
            # REQ-058: skip when main has moved on; the newer commit's own deploy publishes it
            head=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
            if [ "$sha" != "$head" ]; then
              echo "::notice::Skipped: ${sha:0:7} is not the newest commit of main (${head:0:7}); its own deploy publishes the newest version."
              echo "skip=true" >> "$GITHUB_OUTPUT"
            fi
            echo "sha=$sha" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ inputs.ref || github.sha }}" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.ref.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.sha }}
      - if: steps.ref.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build site
        if: steps.ref.outputs.skip != 'true'
        run: |
          npm ci
          npm run build
      # The main script file name has a content hash; the smoke test checks the live site serves this exact file
      - id: entry
        name: Note the built entry script
        if: steps.ref.outputs.skip != 'true'
        run: echo "entry=$(grep -oE '/assets/index-[^"]+\.js' dist/index.html | head -1)" >> "$GITHUB_OUTPUT"
      - if: steps.ref.outputs.skip != 'true'
        uses: actions/configure-pages@v5
      - if: steps.ref.outputs.skip != 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    if: needs.build.outputs.skip != 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4

  smoke-test:
    needs: [build, deploy]
    if: needs.build.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check the live site
        env:
          ENTRY: ${{ needs.build.outputs.entry }}
        run: |
          # GitHub Pages can take a few minutes to serve the new version
          for i in $(seq 1 20); do
            html=$(curl -fsSL --max-time 20 "$SITE_URL/?smoke=$GITHUB_RUN_ID" || true)
            if echo "$html" | grep -q "<title>[^<]*Bee There" && echo "$html" | grep -qF "$ENTRY"; then
              if curl -fsS --max-time 20 -o /dev/null "$SITE_URL$ENTRY"; then
                echo "Live site OK: title found and $ENTRY is served"; exit 0
              fi
            fi
            echo "Attempt $i: new version not live yet, waiting 30s…"; sleep 30
          done
          echo "::error::Smoke test failed: $SITE_URL does not serve the new build ($ENTRY)"; exit 1

  rollback:
    needs: [build, smoke-test]
    if: failure() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Redeploy the last good version and open a bug
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BAD: ${{ needs.build.outputs.sha }}
        run: |
          # Last deploy whose smoke test passed, for a different commit = the version that was live before.
          # Bug #110: skipped deploys (REQ-058) also end as successful runs, so page back through up to 1,000 runs.
          GOOD=""
          for page in $(seq 1 10); do
            runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/compass-deploy.yml/runs?status=success&per_page=100&page=$page" \
              --jq '.workflow_runs[] | "\(.id) \(.display_title | sub("^Deploy ";""))"')
            [ -z "$runs" ] && break
            while read -r run sha; do
              [ "$sha" = "$BAD" ] && continue
              ok=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/jobs" --jq '[.jobs[] | select(.name=="smoke-test" and .conclusion=="success")] | length')
              if [ "$ok" = "1" ]; then GOOD=$sha; break 2; fi
            done <<< "$runs"
          done
          # Only automatic deploys roll back by themselves; a failed manual deploy/rollback just opens the bug (no loops)
          if [ "${{ github.event_name }}" != "workflow_run" ]; then GOOD=""; NOTE_MANUAL=" (manual run: no automatic rollback)"; fi
          if [ -n "$GOOD" ]; then
            gh workflow run compass-deploy.yml --repo "$GITHUB_REPOSITORY" --ref main -f ref="$GOOD"
            NOTE="Rolled back automatically: redeploying \`$GOOD\`."
          else
            NOTE="Nothing was rolled back$NOTE_MANUAL. Redeploy a good commit from Actions → Compass Deploy → Run workflow."
          fi
          gh api "repos/$GITHUB_REPOSITORY/issues" -f title="[Deploy] Smoke test failed for ${BAD:0:7}" \
            -f body="The live site check failed after deploying \`$BAD\` ([run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)). $NOTE" \
            -f "labels[]=bug" --jq .html_url
