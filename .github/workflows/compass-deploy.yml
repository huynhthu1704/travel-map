name: Compass Deploy
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build site
        run: |
          if [ -f package.json ] && node -e "process.exit(require('./package.json').scripts?.build ? 0 : 1)"; then
            if [ -f package-lock.json ]; then npm ci; else npm install; fi
            npm run build
            echo "SITE_DIR=dist" >> $GITHUB_ENV
          else
            mkdir -p _site && cp -r $(ls -A | grep -v -E '^(\.git|\.github|_site|node_modules|compass|tests)$') _site/
            echo "SITE_DIR=_site" >> $GITHUB_ENV
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.SITE_DIR }}
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
